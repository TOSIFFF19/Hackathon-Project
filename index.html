
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #f0f4f8;
            color: #222;
            transition: 0.3s;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            color: #2563eb;
        }

        #count {
            font-size: 60px;
            font-weight: bold;
        }

        button {
            padding: 12px 18px;
            margin: 6px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.8;
        }

        .dark {
            background: #111827;
            color: white;
        }

        .dark .container {
            background: #1f2937;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My First Website 🚀</h1>
        <p>Welcome to my interactive website!</p>

        <p>Your Clicks:</p>
        <div id="count">0</div>

        <button onclick="increase()">Click Me +1</button>
        <button onclick="reset()">Reset</button>
        <button onclick="toggleDark()">Dark Mode 🌙</button>
    </div>

    <script>
        let clicks = 0;

        function increase() {
            clicks++;
            document.getElementById("count").textContent = clicks;
        }

        function reset() {
            clicks = 0;
            document.getElementById("count").textContent = clicks;
        }

        function toggleDark() {
            document.body.classList.toggle("dark");
        }
    </script>
</body>
</html>
